<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>DTW Coordinate Probe</title>
<style>
  body { margin: 20px; font: 20px system-ui; }
  canvas { display: block; border: 1px solid black; }
</style>
<h1 id="status">CLICK NONE</h1>
<canvas id="grid" width="800" height="500" role="img" aria-label="Coordinate grid"></canvas>
<script>
  const canvas = document.getElementById('grid');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f5f5f5'; ctx.fillRect(0, 0, 800, 500);
  for (const [x,y] of [[100,100],[400,250],[700,400]]) {
    ctx.fillStyle = '#f02030';
    ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2); ctx.fill();
  }
  canvas.addEventListener('click', event => {
    const rect = canvas.getBoundingClientRect();
    const x = Math.round((event.clientX - rect.left) * 800 / rect.width);
    const y = Math.round((event.clientY - rect.top) * 500 / rect.height);
    document.getElementById('status').textContent = `CLICK ${x},${y}`;
  });
</script>
