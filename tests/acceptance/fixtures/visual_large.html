<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>DTW Visual Acceptance</title>
<style>
  body { font: 18px system-ui; margin: 20px; color: #19212c; }
  h1 { margin: 0 0 12px; font-size: 24px; }
  canvas { display: block; border: 2px solid #253549; background: #eff7ff; }
  #noise { margin-top: 20px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  #noise button { height: 30px; }
</style>
<h1 id="status"></h1>
<canvas id="target" width="780" height="400"></canvas>
<div id="noise"></div>
<script>
  const reload = Number(sessionStorage.getItem('reload') || '0');
  const clicked = sessionStorage.getItem('clicked') === '1';
  sessionStorage.setItem('reload', String(reload + 1));
  function render() {
    document.getElementById('status').textContent =
      (clicked ? 'VISUAL-CLICKED' : 'VISUAL-READY') +
      ' RELOAD-' + reload;
    const ctx = document.getElementById('target').getContext('2d');
    ctx.clearRect(0, 0, 780, 400);
    ctx.fillStyle = '#eff7ff'; ctx.fillRect(0, 0, 780, 400);
    ctx.fillStyle = '#f02534';
    ctx.beginPath(); ctx.arc(390, 200, 76, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'center'; ctx.fillText('CLICK RED DISK', 390, 208);
  }
  render();
  document.getElementById('target').addEventListener('click', (event) => {
    const rect = event.currentTarget.getBoundingClientRect();
    const x = (event.clientX - rect.left) * 780 / rect.width;
    const y = (event.clientY - rect.top) * 400 / rect.height;
    if ((x - 390) ** 2 + (y - 200) ** 2 <= 76 ** 2) {
      sessionStorage.setItem('clicked', '1');
      document.getElementById('status').textContent = 'VISUAL-CLICKED RELOAD-' + reload;
    }
  });
  const noise = document.getElementById('noise');
  for (let i = 0; i < 800; i++) {
    const button = document.createElement('button');
    button.textContent = 'Background item ' + String(i).padStart(3, '0');
    noise.appendChild(button);
  }
</script>
