<!doctype html><html lang="en"><meta charset="utf-8"><title>DTW browser fixture</title>
<style>body{font:18px system-ui;margin:24px}button,input,select{font:inherit;margin:8px;padding:8px}#drag,#drop{display:inline-block;padding:20px;background:#def;margin:10px}#drop{background:#dfd}</style>
<h1 id="status">READY</h1>
<label>Message <input aria-label="Message" id="message"></label>
<button onclick="report('apply',{value:message.value})">Apply</button>
<label>Color <select aria-label="Color" onchange="report('select',{value:this.value})"><option value="red">Red</option><option value="green">Green</option></select></label>
<section><button oncontextmenu="event.preventDefault();report('right-click')">Right target</button>
<button ondblclick="report('double-click')">Double target</button>
<button onmouseenter="report('hover')">Hover target</button>
<button onclick="report('prompt',{value:prompt('Fixture prompt')})">Open prompt</button></section>
<section><div id="drag" role="button" aria-label="Drag source" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','dtw');report('drag-start')">Drag source</div>
<div id="drop" role="button" aria-label="Drop target" ondragover="event.preventDefault()" ondrop="event.preventDefault();report('drop')">Drop target</div></section>
<label>Test file <input aria-label="Test file" type="file" onchange="report('file',{names:[...this.files].map(f=>f.name)})"></label>
<a href="/download" download="fixture.txt">Download fixture</a>
<div style="height:1400px" aria-label="Scroll area"></div>
<script>
function report(kind,data={}){document.getElementById('status').textContent=kind.toUpperCase();fetch('/event',{method:'POST',body:JSON.stringify({kind,...data})});}
message.addEventListener('input',()=>report('input',{value:message.value}));
window.addEventListener('scroll',()=>report('scroll',{y:scrollY}));
</script></html>
