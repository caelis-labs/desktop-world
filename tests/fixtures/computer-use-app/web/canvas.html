<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Canvas release chat</title><link rel="stylesheet" href="/style.css"><script defer src="/canvas.js"></script></head><body><header><h1>Release chat</h1><nav><a href="/">Operations desk</a></nav></header><main id="chat-shell"><canvas id="chat-canvas" role="img" aria-label="Chat canvas"></canvas><form id="composer-bar"><input id="composer" aria-label="Message composer" autocomplete="off" placeholder="Write a message…" maxlength="2000"><button id="send-message">Send</button></form><p id="chat-status" role="status" aria-live="polite">Right-click a message for actions. Scroll the feed to browse.</p></main></body></html>
