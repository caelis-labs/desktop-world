<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Release operations desk</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><h1>Release operations desk</h1><nav><a href="/canvas">Canvas chat</a> <a href="/vision">Image challenge</a> <span id="workbench"></span></nav></header>
<main><section class="card"><h2>Web acceptance note</h2><label>Web note <input id="web-note" maxlength="20000" autocomplete="off"></label><button id="commit-note">Commit web note</button><button disabled>Publish locked release</button><span class="tooltip-host" tabindex="0">Help<span role="tooltip">Each commit is a separate activation, even with identical text.</span></span><p id="status" role="status" aria-live="polite">Ready</p></section>
<section class="card"><h2>Reference document</h2><label>Web reference<textarea id="web-reference" spellcheck="false" rows="5"></textarea></label><button id="save-reference">Save reference</button></section>
<section class="card"><h2>Work queue</h2><button id="load-catalogue">Load noisy catalogue</button><button id="open-record">New review record</button><label>Search catalogue <input id="search" type="search"></label><label>Review filter <select id="filter"><option>All</option><option>Reviewed</option><option>Pending</option></select></label><label>Page <select id="page"><option value="all">All rows</option><option value="1">1–80</option><option value="2">81–160</option><option value="3">161–240</option></select></label><div class="outer-scroll"><div class="inner-scroll" id="catalogue" aria-label="Noisy catalogue"></div></div></section>
<section class="card"><h2>Capacity board</h2><label>Release capacity <input id="capacity" type="range" min="0" max="100" value="35"></label><output id="capacity-value">35</output><p>Drag the capacity thumb to update the release board.</p></section></main>
<dialog id="record-dialog"><form id="record-form"><h2>Review record</h2><label>Review note<input name="note" required maxlength="1000"></label><label>Review quantity<input name="number" type="number" min="1" max="999" required></label><label><input name="approved" type="checkbox" required>Approved</label><label>Priority<select name="priority"><option>Normal</option><option>Urgent</option></select></label><label>Review date<input name="date" type="date" required></label><p role="status" id="record-status"></p><button id="save-record">Save review</button><button type="button" id="cancel-record">Cancel</button></form></dialog></body></html>
