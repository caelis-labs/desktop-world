[package]
name = "caelis-desktop-world"
version = "0.1.0-rc.3"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
description = "Typed asynchronous native Desktop World client and trusted host session"
repository = "https://github.com/caelis-labs/desktop-world"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
