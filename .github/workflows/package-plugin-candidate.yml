name: package formal plugin candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact reviewed 40-character source SHA
        required: true
        type: string
      version:
        description: Version (vX.Y.Z or vX.Y.Z-rc.N), package candidate only
        required: true
        type: string
permissions:
  contents: read
env:
  CANDIDATE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || github.event.pull_request.head.sha }}
  CANDIDATE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v0.1.0-rc.4' }}
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Verify exact clean source
        shell: bash
        run: |
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_REVISION" ]]
          [[ -z "$(git status --porcelain)" ]]
      - name: Native runtime and MCP tests
        shell: bash
        run: GOWORK=off go test ./cmd/dtw/...
      - name: macOS arm64 package
        shell: bash
        run: ./scripts/package-plugin.sh "$CANDIDATE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-candidate-macos-${{ env.CANDIDATE_VERSION }}-${{ env.CANDIDATE_REVISION }}
          if-no-files-found: error
          path: |
            artifacts/release/${{ env.CANDIDATE_VERSION }}/*.tar.gz
            artifacts/release/${{ env.CANDIDATE_VERSION }}/SHA256SUMS
