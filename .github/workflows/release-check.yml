name: Release asset verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or published release tag to audit (does not publish)
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      # Use the maintained verifier, not executable code from downloaded assets.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download existing assets and resolve tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"])'
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha > "$RUNNER_TEMP/release-tag-commit"
      - name: Audit immutable bytes (no build or publication)
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          python3 scripts/verify-release.py --assets "$RUNNER_TEMP/release-assets" --tag "$RELEASE_TAG" --tag-commit "$(cat "$RUNNER_TEMP/release-tag-commit")"
