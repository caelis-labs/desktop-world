name: Release asset verification
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or published release tag to audit (does not publish)
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch'
    # GitHub hides draft releases from readers. Commands only download/audit;
    # write capability is required to see the draft, not to publish it.
    permissions:
      contents: write
    uses: ./.github/workflows/release-verify.yml
    with:
      tag: ${{ inputs.tag }}
