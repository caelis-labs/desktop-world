name: Rewrite Linux candidate

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      skip_source_tests:
        type: boolean
        default: false
    outputs:
      artifact_id:
        value: ${{ jobs.linux-candidate.outputs.artifact_id }}
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
        default: x86_64-unknown-linux-gnu

permissions:
  contents: read

concurrency:
  group: rewrite-linux-candidate-${{ inputs.target }}-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  linux-candidate:
    runs-on: ${{ inputs.runner || (inputs.target == 'aarch64-unknown-linux-gnu' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      DTW_TARGET: ${{ inputs.target }}
      DTW_CARGO_TARGET_DIR: ${{ github.workspace }}/../dtw-candidate-release-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: dtw-candidate-release-v1
          key: ${{ inputs.target }}-ubuntu-24.04
          workspaces: cmd/dtw -> ../../../dtw-candidate-release-target
          cache-bin: false
      - name: Build fixed native Linux package and exercise source contracts
        env:
          SKIP_SOURCE_TESTS: ${{ inputs.skip_source_tests == true }}
        run: |
          python3 scripts/build-rewrite-candidate.py --target "$DTW_TARGET" --output "$RUNNER_TEMP/dtw-rewrite-candidate" --cargo-target-dir "$DTW_CARGO_TARGET_DIR"
          if [ "${SKIP_SOURCE_TESTS:-false}" != "true" ]; then
            export CARGO_TARGET_DIR="$DTW_CARGO_TARGET_DIR"
            export RUSTC="$(rustup run 1.98.0 rustc --print sysroot)/bin/rustc"
            rustup run 1.98.0 cargo test --release --locked --manifest-path "$RUNNER_TEMP/dtw-rewrite-candidate/source/cmd/dtw/Cargo.toml" --target "$DTW_TARGET" --lib --bins --tests
          fi
      - name: Verify final archive, managed import, MCP and worker shutdown (no desktop)
        run: |
          python3 "$RUNNER_TEMP/dtw-rewrite-candidate/source/scripts/check-linux-candidate.py" --candidate "$RUNNER_TEMP/dtw-rewrite-candidate" --output "$RUNNER_TEMP/dtw-rewrite-candidate/package-check"
      - name: Cache Linux X11/AT-SPI apt packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dtw-apt-cache
          key: dtw-linux-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/ci/install_linux_x11_deps.sh') }}
          restore-keys: |
            dtw-linux-apt-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install X11 and accessibility fixture dependencies
        run: sh tests/ci/install_linux_x11_deps.sh "$RUNNER_TEMP/dtw-apt-cache"
      - name: Exercise the installed archive in private Xvfb, Openbox and GTK/AT-SPI sessions
        run: |
          candidate="$RUNNER_TEMP/dtw-rewrite-candidate"
          evidence="$candidate/x11-acceptance"
          mkdir "$evidence"
          dtw=$(jq -er '.executable' "$candidate/package-check/import.json")
          sha=$(jq -er '.binary_sha256' "$candidate/CANDIDATE.json")
          probes="$candidate/source/tests/acceptance"
          status=0
          /usr/bin/python3 "$probes/linux_x11_probe.py" --isolated --binary "$dtw" \
            --sha256 "$sha" --artifacts "$evidence/x11" | tee "$evidence/x11.jsonl" || status=1
          /usr/bin/python3 "$probes/linux_atspi_probe.py" --binary "$dtw" \
            --output "$evidence/atspi" | tee "$evidence/atspi.jsonl" || status=1
          /usr/bin/python3 "$probes/linux_lifecycle_probe.py" --binary "$dtw" \
            --artifacts "$evidence/lifecycle" | tee "$evidence/lifecycle.jsonl" || status=1
          exit "$status"
        shell: bash
      - name: Retain isolated Linux GUI receipts and PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtw-linux-${{ inputs.target }}-x11-${{ inputs.source_sha || github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: ignore
          path: ${{ runner.temp }}/dtw-rewrite-candidate/x11-acceptance
      - name: Retain immutable package and original construction evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtw-linux-${{ inputs.target }}-candidate-${{ inputs.source_sha || github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/dtw-rewrite-candidate/*.tar.gz
            ${{ runner.temp }}/dtw-rewrite-candidate/*.sha256
            ${{ runner.temp }}/dtw-rewrite-candidate/CANDIDATE.json
            ${{ runner.temp }}/dtw-rewrite-candidate/FAILURE.json
            ${{ runner.temp }}/dtw-rewrite-candidate/commands.json
            ${{ runner.temp }}/dtw-rewrite-candidate/logs
            ${{ runner.temp }}/dtw-rewrite-candidate/package-check/report.json
            ${{ runner.temp }}/dtw-rewrite-candidate/package-check/import.json
            ${{ runner.temp }}/dtw-rewrite-candidate/package-check/worker-*.stderr
            ${{ runner.temp }}/dtw-rewrite-candidate/package-check/packaged-mcp
