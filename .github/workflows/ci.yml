name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dtw-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tree: ${{ steps.plan.outputs.tree }}
      reused_run: ${{ steps.plan.outputs.reused_run }}
      source: ${{ steps.plan.outputs.source }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
      package_upgrade: ${{ steps.plan.outputs.package_upgrade }}
      linux_gui: ${{ steps.plan.outputs.linux_gui }}
      linux_candidate: ${{ steps.plan.outputs.linux_candidate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/ci/plan.py

  portable:
    name: Portable checks
    needs: plan
    if: needs.plan.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - run: sh scripts/check-source.sh
      - name: Validate workflow wiring with pinned actionlint
        run: |
          dtwArchive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$dtwArchive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$dtwArchive" | sha256sum --check -
          tar -xzf "$dtwArchive" -C "$RUNNER_TEMP" actionlint
          # GitHub's documented queue:max field is newer than actionlint 1.7.12.
          # Validate its one supported value here; retain every other lint rule.
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('.github/workflows').glob('*.yml'):
              for line in path.read_text().splitlines():
                  if re.match(r'\s*queue:', line):
                      assert line.strip() == 'queue: max', f'Invalid queue value in {path}'
          PY
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= \
            -ignore '^unexpected key "queue" for "concurrency" section\.'

  macos-inventory:
    # Preserve the existing required check; it now includes the runtime contract.
    name: macOS inventory controls
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    # The 15/26 arm64 pools failed admission; the standard GA Xcode image has
    # passed a full native signed/notarized candidate preflight. Match shipping
    # architecture/toolchain here and retain every native gate.
    runs-on: xcode-27
    # Include both cold release compilation and the two-version upgrade build.
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: cmd/dtw -> ../../target-ci
          key: macos-arm64-runtime-release
      # Compile pure Swift/C-ABI controls first so bridge failures fail before
      # the slower cold release build. These checks never operate a desktop.
      - run: python3 tests/ci/run_native_inventory_tests.py
      - run: python3 tests/ci/run_native_input_tests.py
      - name: Repository bootstrap with system macOS tools (no install)
        run: python3 -m unittest discover -s tests -p 'test_setup_bootstrap_posix.py'
      # Match the shipping QuickJS build and stack behavior, not an unoptimized VM.
      - name: Script, MCP, native adapters and CLI contracts
        run: cargo test --release --locked --manifest-path cmd/dtw/Cargo.toml --lib --bins --tests
      - name: Managed packages and live MCP leases (no GUI)
        if: needs.plan.outputs.package_upgrade == 'true'
        run: python3 tests/ci/check_package_upgrade.py --dtw "$CARGO_TARGET_DIR/release/dtw" --output "$RUNNER_TEMP/dtw-package-store" --published-v0.6.1
      - name: Native and scene worker shutdown (no desktop access)
        run: python3 tests/ci/run_native_worker_tests.py "$CARGO_TARGET_DIR/release/dtw"

  windows:
    name: Windows adapter contracts
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: cmd/dtw -> ../../target-ci
          key: windows-runtime-release
      # Shared opaque references and lifecycle contracts apply to both platforms.
      - name: Windows adapters, script, MCP and CLI contracts
        shell: pwsh
        run: |
          cargo test --release --locked --manifest-path cmd/dtw/Cargo.toml --lib --bins --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Repository bootstrap with isolated Windows fixtures (no install)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -File tests/acceptance/windows/bootstrap_probe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File tests/acceptance/windows/bootstrap_probe.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Managed packages and live MCP leases (no GUI)
        if: needs.plan.outputs.package_upgrade == 'true'
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: python tests/ci/check_package_upgrade.py --dtw "$env:CARGO_TARGET_DIR\release\dtw.exe" --output "$env:RUNNER_TEMP\dtw-package-store"
      - name: Acceptance observer file-sharing controls (no GUI)
        shell: pwsh
        run: python -m unittest discover -s tests -p test_windows_app_protocol_probe.py
      - name: Compile the real-machine acceptance fixtures (do not run GUI)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/acceptance/windows/smoke.ps1 -CompileOnly -OutputDirectory "$env:RUNNER_TEMP/dtw-fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/acceptance/windows/compile-cursor.ps1 -OutputDirectory "$env:RUNNER_TEMP/dtw-cursor"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  linux:
    name: Linux adapter contracts
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: cmd/dtw -> ../../target-ci
          key: linux-x86_64-runtime-release
      - name: Linux adapters, script, MCP and CLI contracts
        run: cargo test --release --locked --manifest-path cmd/dtw/Cargo.toml --lib --bins --tests
      - name: Headless MCP metadata and worker shutdown (no desktop)
        run: python3 scripts/check-linux-candidate.py --binary "$CARGO_TARGET_DIR/release/dtw" --output "$RUNNER_TEMP/dtw-linux-headless"
      - name: Managed packages and live MCP leases (no GUI)
        if: needs.plan.outputs.package_upgrade == 'true'
        run: python3 tests/ci/check_package_upgrade.py --dtw "$CARGO_TARGET_DIR/release/dtw" --output "$RUNNER_TEMP/dtw-package-store"
      - name: Cache Linux X11/AT-SPI apt packages
        if: needs.plan.outputs.linux_gui == 'true' && needs.plan.outputs.linux_candidate == 'false'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dtw-apt-cache
          key: dtw-linux-apt-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/ci/install_linux_x11_deps.sh') }}
          restore-keys: |
            dtw-linux-apt-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install X11 and accessibility fixture dependencies
        if: needs.plan.outputs.linux_gui == 'true' && needs.plan.outputs.linux_candidate == 'false'
        run: sh tests/ci/install_linux_x11_deps.sh "$RUNNER_TEMP/dtw-apt-cache"
      - name: Exercise built binary in private Xvfb, Openbox and GTK/AT-SPI sessions
        if: needs.plan.outputs.linux_gui == 'true' && needs.plan.outputs.linux_candidate == 'false'
        shell: bash
        run: |
          set -euo pipefail
          dtw="$CARGO_TARGET_DIR/release/dtw"
          sha=$(sha256sum "$dtw" | awk '{print $1}')
          evidence="$RUNNER_TEMP/dtw-linux-x11"
          mkdir -p "$evidence"
          status=0
          /usr/bin/python3 tests/acceptance/linux_x11_probe.py --isolated --binary "$dtw" \
            --sha256 "$sha" --artifacts "$evidence/x11" | tee "$evidence/x11.jsonl" || status=1
          /usr/bin/python3 tests/acceptance/linux_atspi_probe.py --binary "$dtw" \
            --output "$evidence/atspi" | tee "$evidence/atspi.jsonl" || status=1
          /usr/bin/python3 tests/acceptance/linux_lifecycle_probe.py --binary "$dtw" \
            --artifacts "$evidence/lifecycle" | tee "$evidence/lifecycle.jsonl" || status=1
          exit "$status"
      - name: Retain Linux CI diagnostics and GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtw-linux-ci-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/dtw-linux-headless
            ${{ runner.temp }}/dtw-linux-x11
            ${{ runner.temp }}/dtw-package-store

  linux-candidate:
    name: Linux x86_64 candidate
    needs: plan
    if: needs.plan.outputs.linux_candidate == 'true'
    uses: ./.github/workflows/rewrite-linux-candidate.yml
    with:
      source_sha: ${{ github.sha }}
      target: x86_64-unknown-linux-gnu
      runner: ubuntu-24.04
      skip_source_tests: true
      skip_gui: ${{ needs.plan.outputs.linux_gui != 'true' }}

  source:
    # Keep the protected status name; unlike a skipped platform job this gate
    # fails if any selected check failed, was cancelled, or was unexpectedly skipped.
    name: Source checks
    needs: [plan, portable, macos-inventory, windows, linux, linux-candidate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          needs = json.loads(os.environ['NEEDS'])
          assert needs['plan']['result'] == 'success', 'CI planning failed'
          plan = needs['plan']['outputs']
          assert re.fullmatch(r'[0-9a-f]{40}', plan['tree']), 'Invalid verified tree'
          jobs = {'portable': 'source', 'macos-inventory': 'macos', 'windows': 'windows',
                  'linux': 'linux', 'linux-candidate': 'linux_candidate'}
          checks = (*jobs.values(), 'package_upgrade', 'linux_gui')
          assert all(plan.get(key) in ('true', 'false') for key in checks), 'Invalid check selection'
          reused = plan.get('reused_run', '')
          if plan['source'] == 'false':
              assert os.environ['GITHUB_EVENT_NAME'] == 'push' and re.fullmatch(r'[1-9][0-9]*', reused), 'Missing reuse evidence'
              assert all(plan[key] == 'false' for key in checks), 'Unexpected check selection for a reused run'
          else:
              assert reused == '', 'Unexpected reuse evidence for a fresh run'
          for job, selected in jobs.items():
              expected = 'success' if plan[selected] == 'true' else 'skipped'
              assert needs[job]['result'] == expected, f'{job}: {needs[job]["result"]}, expected {expected}'
          PY
      - name: Record verified tree for main (no code or binaries in the receipt)
        env:
          TREE: ${{ needs.plan.outputs.tree }}
          REUSED_RUN: ${{ needs.plan.outputs.reused_run }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {'schema': 1, 'tree': os.environ['TREE'], 'run_id': int(os.environ['GITHUB_RUN_ID']),
                    'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']), 'event': os.environ['GITHUB_EVENT_NAME'], 'checks': 'passed'}
          Path('verified.json').write_text(json.dumps(record), encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Verified tree: `' + record['tree'] + '`\n')
              if os.environ['REUSED_RUN']:
                  output.write('Reused identical-tree PR CI run: ' + os.environ['REUSED_RUN'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified.json
          retention-days: 90
