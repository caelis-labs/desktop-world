name: contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run ./examples/headless
      - run: go run ./examples/embodied
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test clients/javascript/desktop.test.mjs
      - run: python3 verify_examples.py
  native-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - run: ./script/build_and_run.sh --build-only
# Hosted CI is deliberately not counted as interactive desktop acceptance.
# Run tests/acceptance on logged-in, authorized macOS and Windows machines.
