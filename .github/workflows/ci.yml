name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dtw-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos-package:
    name: macOS source, package, and MCP
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Restore pinned Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/dtw-cua-build
          key: dtw-rust-${{ runner.os }}-${{ runner.arch }}-1.98.0-d74a9ca-${{ hashFiles('cmd/dtw/Cargo.lock', 'cmd/dtw/**/*.rs') }}
          restore-keys: |
            dtw-rust-${{ runner.os }}-${{ runner.arch }}-1.98.0-d74a9ca-
      - name: Format Rust
        run: cargo +1.98.0 fmt --manifest-path cmd/dtw/Cargo.toml --check
      - name: Check Python harness syntax
        run: python3 -m compileall -q scripts tests/acceptance
      - name: Build package from pinned CUA source
        env:
          DTW_BUILD_DIR: ${{ runner.temp }}/dtw-cua-build
          DTW_CUA_SOURCE_DIR: ${{ runner.temp }}/dtw-cua-source
        run: scripts/build-plugin.sh "$RUNNER_TEMP/dtw-plugin"
      - name: Verify package and desktop-independent MCP
        run: |
          (cd "$RUNNER_TEMP/dtw-plugin" && shasum -a 256 -c SHA256SUMS)
          codesign --verify "$RUNNER_TEMP/dtw-plugin/bin/dtw"
          codesign --verify "$RUNNER_TEMP/dtw-plugin/libexec/cua-driver"
          python3 tests/acceptance/mcp_smoke.py "$RUNNER_TEMP/dtw-plugin/bin/dtw"
          python3 tests/acceptance/licenses_probe.py "$RUNNER_TEMP/dtw-plugin"
          python3 tests/acceptance/contract_probe.py "$RUNNER_TEMP/dtw-plugin/bin/dtw"
          python3 tests/acceptance/runtime_probe.py "$RUNNER_TEMP/dtw-plugin/bin/dtw"
          python3 tests/acceptance/package_install_probe.py "$RUNNER_TEMP/dtw-plugin" --output "$RUNNER_TEMP/install-probe"
          CARGO_TARGET_DIR="$RUNNER_TEMP/dtw-cua-build/dtw" cargo +1.98.0 test --manifest-path cmd/dtw/Cargo.toml --release --locked

  windows-package:
    name: Windows source, package, and MCP
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Restore pinned Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/dtw-cua-build
          key: dtw-rust-${{ runner.os }}-${{ runner.arch }}-1.98.0-d74a9ca-${{ hashFiles('cmd/dtw/Cargo.lock', 'cmd/dtw/**/*.rs') }}
          restore-keys: |
            dtw-rust-${{ runner.os }}-${{ runner.arch }}-1.98.0-d74a9ca-
      - name: Check Python harness syntax
        run: python -m compileall -q scripts tests/acceptance
      - name: Format Rust
        run: cargo +1.98.0 fmt --manifest-path cmd/dtw/Cargo.toml --check
      - name: Build package from pinned CUA source
        shell: pwsh
        env:
          DTW_BUILD_DIR: ${{ runner.temp }}/dtw-cua-build
          DTW_CUA_SOURCE_DIR: ${{ runner.temp }}/dtw-cua-source
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'dtw-plugin'
          ./scripts/build-plugin.ps1 $package
          "DTW_PACKAGE=$package" >> $env:GITHUB_ENV
      - name: Verify package and desktop-independent MCP
        shell: pwsh
        run: |
          $required = @('bin/dtw.exe', 'libexec/cua-driver.exe', 'LICENSE',
                        'NOTICE', 'CUA-MIT-LICENSE.txt', 'CUA-THIRD_PARTY_NOTICES.md',
                        'skills/desktop-world/SKILL.md')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:DTW_PACKAGE $name))) {
              throw "Package file missing: $name"
            }
          }
          $mcp = Get-Content -LiteralPath (Join-Path $env:DTW_PACKAGE 'mcp.json') -Raw | ConvertFrom-Json
          if ($mcp.mcpServers.'desktop-world'.command -ne './bin/dtw.exe') {
            throw 'Windows MCP command does not name dtw.exe'
          }
          foreach ($line in Get-Content -LiteralPath (Join-Path $env:DTW_PACKAGE 'SHA256SUMS')) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum line: $line" }
            $file = Join-Path $env:DTW_PACKAGE $Matches[2]
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) { throw "Checksum mismatch: $file" }
          }
          python tests/acceptance/mcp_smoke.py (Join-Path $env:DTW_PACKAGE 'bin/dtw.exe')
          if ($LASTEXITCODE -ne 0) { throw "MCP smoke failed with exit code $LASTEXITCODE" }
          python tests/acceptance/licenses_probe.py $env:DTW_PACKAGE
          if ($LASTEXITCODE -ne 0) { throw "License check failed with exit code $LASTEXITCODE" }
          python tests/acceptance/contract_probe.py (Join-Path $env:DTW_PACKAGE 'bin/dtw.exe')
          if ($LASTEXITCODE -ne 0) { throw "Contract probe failed with exit code $LASTEXITCODE" }
          python tests/acceptance/runtime_probe.py (Join-Path $env:DTW_PACKAGE 'bin/dtw.exe')
          if ($LASTEXITCODE -ne 0) { throw "Runtime probe failed with exit code $LASTEXITCODE" }
          python tests/acceptance/package_install_probe.py $env:DTW_PACKAGE --output (Join-Path $env:RUNNER_TEMP 'install-probe')
          if ($LASTEXITCODE -ne 0) { throw "Installation probe failed with exit code $LASTEXITCODE" }
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'dtw-cua-build/dtw'
          cargo +1.98.0 test --manifest-path cmd/dtw/Cargo.toml --release --locked
          if ($LASTEXITCODE -ne 0) { throw "Adapter regression test failed with exit code $LASTEXITCODE" }
