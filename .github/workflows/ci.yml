name: CI
on:
  push:
  pull_request:

jobs:
  macos-source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: rustfmt
      - name: Format
        run: cargo +1.98.0 fmt --manifest-path cmd/dtw/Cargo.toml --check
      - name: Compile source
        run: cargo +1.98.0 check --manifest-path cmd/dtw/Cargo.toml --locked
      - name: Check acceptance harness syntax
        run: python3 -m compileall -q tests/acceptance
