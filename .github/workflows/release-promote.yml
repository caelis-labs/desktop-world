name: Publish accepted release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Please draft tag (vX.Y.Z)
        required: true
        type: string
      macos_run_id:
        description: Successful macOS candidate run whose exact ZIP passed acceptance
        required: true
        type: string
      windows_run_id:
        description: Successful Windows candidate run whose exact ZIP passed acceptance
        required: true
        type: string
      gui_accepted:
        description: I have verified these exact candidate packages; scope is recorded below
        required: true
        default: false
        type: boolean
      acceptance_notes:
        description: Actual platform GUI/Harness acceptance scope and any retained failures
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: dtw-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      # Draft visibility and explicit publication both require a writer.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve, verify, upload, preflight and publish accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          GUI_ACCEPTED: ${{ inputs.gui_accepted }}
          ACCEPTANCE_NOTES: ${{ inputs.acceptance_notes }}
        run: python3 scripts/promote-release.py --output "$RUNNER_TEMP/release-promotion"
      # GITHUB_TOKEN publications do not trigger another release workflow.
      # The promoter therefore downloads and audits again after publishing.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-promotion-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: ${{ runner.temp }}/release-promotion/report.json
