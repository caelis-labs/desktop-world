[package]
name = "desktop-world"
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/caelis-labs/desktop-world"

[[bin]]
name = "dtw"
path = "src/main.rs"

[[example]]
name = "native_checkpoint"

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
base64 = "0.22.1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
strip = "symbols"
