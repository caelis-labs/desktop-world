[package]
name = "desktop-world"
version = "0.2.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/caelis-labs/desktop-world"

[[bin]]
name = "dtw"
path = "src/main.rs"

[[example]]
name = "native_checkpoint"

[dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
base64 = "0.22.1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "time", "io-util"] }

tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
foreign-types = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
png = "0.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_RemoteDesktop", "Win32_Storage_FileSystem", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest", "res", "xinput"] }

[profile.release]
strip = "symbols"
