[package]
name = "desktop-world"
version = "0.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/caelis-labs/desktop-world"

[[bin]]
name = "dtw"
path = "src/main.rs"

[features]
native-checkpoints = ["dep:base64"]
app-protocol = ["native-checkpoints"]

[[example]]
name = "native_checkpoint"
required-features = ["native-checkpoints"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "85e2b1318bd77ccf3cfa88ccdf875a4bb7eaed19" }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
toml_edit = "0.25.12"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
strip = "symbols"
