[package]
name = "desktop-world"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/caelis-labs/desktop-world"

[[bin]]
name = "dtw"
path = "src/main.rs"

[dependencies]
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", rev = "2d2f99228d4d2508dc6fcc84c176b296e146714a" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
toml_edit = "0.25.12"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
strip = "symbols"
